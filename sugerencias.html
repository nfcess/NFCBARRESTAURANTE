<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sugerencias - Bar El Parque</title>
</head>

<body>
    <div class="fondo"></div>

    <main>
        <a class="back-link" href="index.html">← Volver</a>

        <header>
            <h1>¿Tenés una sugerencia?</h1>
            <p class="mensaje">Tu mensaje es privado. Solo lo verá el dueño.</p>
        </header>

        <form id="feedback-form">
            <label>¿Cómo fue tu experiencia?</label>
            <select name="rating">
                <option value="">No quiero calificar</option>
                <option value="5">★★★★★ - Excelente</option>
                <option value="4">★★★★ - Muy buena</option>
                <option value="3">★★★ - Buena</option>
                <option value="2">★★ - Regular</option>
                <option value="1">★ - Mala</option>
            </select>

            <label>Contanos tu sugerencia</label>
            <textarea name="message" maxlength="1000" required placeholder="Escribí tu mensaje acá..."></textarea>

            <label>Tu nombre (opcional)</label>
            <input type="text" name="name" maxlength="80" placeholder="Ej.: María">

            <label>Contacto (opcional)</label>
            <input type="text" name="contact" maxlength="120" placeholder="Email o teléfono">

            <button id="submit-button" type="submit">Enviar sugerencia</button>
            <p id="form-status" class="form-status"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="feedback.js"></script>
</body>
